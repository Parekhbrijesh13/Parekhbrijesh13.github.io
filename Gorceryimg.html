<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Image Gallery</title>
  <style>
    :root {
      --page: #f7f9f2;
      --ink: #172017;
      --muted: #60705d;
      --panel: #ffffff;
      --line: #dfe7d8;
      --accent: #2f7d4d;
      --accent-strong: #205c37;
      --gold: #f3c34a;
      --shadow: 0 18px 45px rgba(23, 32, 23, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(47, 125, 77, 0.12), transparent 34%),
        linear-gradient(225deg, rgba(243, 195, 74, 0.16), transparent 38%),
        var(--page);
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    .gallery-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .count {
      flex: 0 0 auto;
      min-width: 92px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      color: var(--accent-strong);
      font-weight: 700;
      text-align: center;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
      padding-top: 28px;
    }

    .gallery-card {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }

    .gallery-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #e7ede0;
      transition: transform 180ms ease;
    }

    .gallery-card:focus-within img,
    .gallery-card:hover img {
      transform: scale(1.025);
    }

    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 58px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .tag {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(47, 125, 77, 0.1);
      color: var(--accent-strong);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(7, 12, 8, 0.84);
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox-inner {
      width: min(1120px, 100%);
    }

    .lightbox-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .lightbox-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.4;
      font-weight: 700;
    }

    .close-button {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
    }

    .lightbox img {
      display: block;
      width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 8px;
      background: #ffffff;
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 24px;
      }

      .gallery-header {
        display: block;
      }

      h1 {
        font-size: 1.55rem;
      }

      .count {
        display: inline-block;
        margin-top: 16px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .lightbox {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="gallery-header">
      <div>
        <h1>Grocery Image Gallery</h1>
        <p class="subtitle">Screenshots from the grocery website pages.</p>
      </div>
      <div class="count">15 Images</div>
    </header>

    <section class="gallery-grid" aria-label="Grocery screenshots">
      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Home Page" data-src="images-ss/screencapture-127-0-0-1-8000-2026-05-19-12_45_09.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-2026-05-19-12_45_09.png" alt="Home page screenshot" loading="lazy">
        </button>
        <figcaption>Home Page <span class="tag">Home</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Shop Page" data-src="images-ss/screencapture-127-0-0-1-8000-home-shop-2026-05-19-12_45_42.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-home-shop-2026-05-19-12_45_42.png" alt="Shop page screenshot" loading="lazy">
        </button>
        <figcaption>Shop Page <span class="tag">Store</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="About Page" data-src="images-ss/screencapture-127-0-0-1-8000-home-about-2026-05-19-12_46_03.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-home-about-2026-05-19-12_46_03.png" alt="About page screenshot" loading="lazy">
        </button>
        <figcaption>About Page <span class="tag">Info</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Contact Page" data-src="images-ss/screencapture-127-0-0-1-8000-home-contact-2026-05-19-12_46_22.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-home-contact-2026-05-19-12_46_22.png" alt="Contact page screenshot" loading="lazy">
        </button>
        <figcaption>Contact Page <span class="tag">Info</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Today Offers Page" data-src="images-ss/screencapture-127-0-0-1-8000-home-today-offers-2026-05-19-12_46_41.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-home-today-offers-2026-05-19-12_46_41.png" alt="Today offers page screenshot" loading="lazy">
        </button>
        <figcaption>Today Offers <span class="tag">Deals</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Cart Page" data-src="images-ss/screencapture-127-0-0-1-8000-cart-2026-05-19-12_48_06.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-cart-2026-05-19-12_48_06.png" alt="Cart page screenshot" loading="lazy">
        </button>
        <figcaption>Cart Page <span class="tag">Order</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Checkout Success Page" data-src="images-ss/screencapture-127-0-0-1-8000-checkout-success-2-2026-05-19-12_48_48.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-checkout-success-2-2026-05-19-12_48_48.png" alt="Checkout success page screenshot" loading="lazy">
        </button>
        <figcaption>Checkout Success <span class="tag">Order</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Orders Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-orders-2026-05-19-12_40_09.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-orders-2026-05-19-12_40_09.png" alt="Admin orders page screenshot" loading="lazy">
        </button>
        <figcaption>Admin Orders <span class="tag">Admin</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Customers Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-customers-2026-05-19-12_40_30.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-customers-2026-05-19-12_40_30.png" alt="Admin customers page screenshot" loading="lazy">
        </button>
        <figcaption>Admin Customers <span class="tag">Admin</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Products Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-products-2026-05-19-12_40_42.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-products-2026-05-19-12_40_42.png" alt="Admin products page screenshot" loading="lazy">
        </button>
        <figcaption>Admin Products <span class="tag">Admin</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Product Create Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-products-create-2026-05-19-12_40_55.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-products-create-2026-05-19-12_40_55.png" alt="Admin product create page screenshot" loading="lazy">
        </button>
        <figcaption>Add Product <span class="tag">Admin</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Categories Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-categories-2026-05-19-12_41_10.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-categories-2026-05-19-12_41_10.png" alt="Admin categories page screenshot" loading="lazy">
        </button>
        <figcaption>Admin Categories <span class="tag">Admin</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Inventory Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-inventory-2026-05-19-12_41_22.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-inventory-2026-05-19-12_41_22.png" alt="Admin inventory page screenshot" loading="lazy">
        </button>
        <figcaption>Admin Inventory <span class="tag">Admin</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Offers Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-offers-2026-05-19-12_41_40.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-offers-2026-05-19-12_41_40.png" alt="Admin offers page screenshot" loading="lazy">
        </button>
        <figcaption>Admin Offers <span class="tag">Admin</span></figcaption>
      </figure>

      <figure class="gallery-card">
        <button class="image-button" type="button" data-title="Admin Settings Page" data-src="images-ss/screencapture-127-0-0-1-8000-admin-settings-2026-05-19-12_41_58.png">
          <img src="images-ss/screencapture-127-0-0-1-8000-admin-settings-2026-05-19-12_41_58.png" alt="Admin settings page screenshot" loading="lazy">
        </button>
        <figcaption>Admin Settings <span class="tag">Admin</span></figcaption>
      </figure>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <div class="lightbox-top">
        <p class="lightbox-title" id="lightbox-title"></p>
        <button class="close-button" type="button" aria-label="Close image preview">&times;</button>
      </div>
      <img id="lightbox-image" src="" alt="">
    </div>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxTitle = document.getElementById('lightbox-title');
    const closeButton = document.querySelector('.close-button');

    document.querySelectorAll('.image-button').forEach((button) => {
      button.addEventListener('click', () => {
        lightboxImage.src = button.dataset.src;
        lightboxImage.alt = `${button.dataset.title} screenshot`;
        lightboxTitle.textContent = button.dataset.title;
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        closeButton.focus();
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.src = '';
    }

    closeButton.addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && lightbox.classList.contains('is-open')) {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
